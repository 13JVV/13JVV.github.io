<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CrowdSense">
  <!--
    파비콘 — 주황 바탕에 각진 흰 느낌표.
    주황(#F97316)은 앱 5단계 경보 척도의 '주의' 색을 그대로 쓴다(lib/levels.ts).

    형태: 위가 넓고 아래로 급히 좁아지는 사다리꼴 막대 + 사각 점.
    곡선을 쓰지 않아 위험표지(hazard sign)의 긴박한 인상을 준다.
    막대는 y 6~39, 점은 y 47~60으로 아이콘 높이의 약 84%를 차지한다.

    주의: components/BrandMark.tsx 가 같은 도형을 그린다. 한쪽만 바꾸면
    탭 아이콘과 헤더 로고가 어긋나므로 두 파일을 함께 수정할 것.
  -->
  <rect width="64" height="64" rx="4" fill="#F97316"/>
  <polygon points="22.5,6 41.5,6 36,39 28,39" fill="#FFFFFF"/>
  <rect x="26" y="47" width="12" height="13" fill="#FFFFFF"/>
</svg>
